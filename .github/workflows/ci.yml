# The merge gate for diagram-viewer.
#
# It runs the same command the README tells a person to run — `bash run.sh
# test` — rather than a hand-written `uv run pytest`. If the documented entry
# point breaks, the gate goes red, which is the point: a CI recipe that drifts
# from the documented one tests something nobody actually runs.
name: CI

on:
  # Unscoped on purpose. `branches: [main]` would silently exempt a PR stacked
  # on another branch — the one most likely to need checking.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on `main`: its result is the record of what the trunk
  # actually does.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The job id is the status-check context that branch protection requires, so
  # keep it stable: renaming this job silently un-gates the branch, because
  # protection goes on requiring a context that no longer reports.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv installs the interpreter too, reading .python-version (3.12), so the
      # runner needs no system Python of any particular version — the same
      # property that lets one checkout serve Linux and macOS.
      # Pinned to an exact release, not `@v10`: astral-sh/setup-uv stopped
      # publishing moving major tags after v7, so `@v10` resolves to nothing
      # and the job dies in "Set up job" before a single step runs.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Chromium for the E2E tier, with the system libraries a headless
      # browser needs on ubuntu-latest. `run.sh test` also calls
      # `playwright install chromium`, which is then a no-op — but it cannot
      # install the apt packages, and it must not try: `--with-deps` shells out
      # to sudo, which is right here and wrong on a contributor's laptop.
      #
      # A missing browser is a FAILURE, not a skip. If this step breaks, the
      # E2E tier fails loudly rather than quietly halving the gate's coverage.
      - name: Install the browser the E2E tier drives
        run: uv run playwright install --with-deps chromium

      # pytest exits 5 when it collects nothing, and run.sh execs it, so a
      # suite that silently stopped matching any files fails here rather than
      # passing over an empty set.
      #
      # The E2E tier drives a real browser against a real uvicorn and imports
      # Mermaid from the CDN, exactly as a reader's browser does — so this job
      # needs outbound internet. That is deliberate; see the README.
      - name: Gate (unit + integration + E2E)
        run: bash run.sh test
