<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diagram Gallery{% endblock %}</title>
    <!-- Mermaid is loaded from the CDN, so the page needs internet to draw.
         Offline, the HTML still returns 200 and the diagrams simply stay blank. -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        h1 {
            border-bottom: 2px solid #334155;
            padding-bottom: 0.75rem;
        }
        a {
            color: #38bdf8;
        }
        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            margin-top: 0;
        }
        .card h2 a {
            text-decoration: none;
        }
        .card h2 a:hover {
            text-decoration: underline;
        }
        .desc {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .mermaid {
            background: #ffffff;
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1rem;
            overflow-x: auto;
        }
        .back {
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .empty {
            color: #94a3b8;
        }
        details {
            margin-top: 1.5rem;
            color: #94a3b8;
        }
        details pre {
            background: #0f172a;
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
