<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diagram Gallery{% endblock %}</title>
    <!-- Mermaid is loaded from the CDN, so the page needs internet to draw.
         Offline, the HTML still returns 200 and the diagrams simply stay blank. -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        h1 {
            border-bottom: 2px solid #334155;
            padding-bottom: 0.75rem;
        }
        a {
            color: #38bdf8;
        }
        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            margin-top: 0;
        }
        .card h2 a {
            text-decoration: none;
        }
        .card h2 a:hover {
            text-decoration: underline;
        }
        .desc {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .mermaid {
            background: #ffffff;
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1rem;
            overflow-x: auto;
        }

        /* --- zoom ---------------------------------------------------------
           The viewport clips and scrolls; the pane inside it is what scales.
           Scaling the pane rather than the SVG keeps Mermaid's own inline
           `max-width` on the <svg> out of the argument, and keeps the
           scrollable area honest: a transform alone does not grow the
           scrollbars, so the pane's width/height are set from the measured
           size at each zoom step. */
        .zoom-viewport {
            background: #ffffff;
            border-radius: 6px;
            margin-top: 1rem;
            overflow: auto;
            max-height: 75vh;
            position: relative;
        }
        /* The sizer is what the scrollbars measure. A CSS transform does not
           affect layout, so scaling the pane alone would leave the scrollable
           area stuck at 100% and clip a zoomed-in diagram. */
        .zoom-sizer {
            width: max-content;
        }
        .zoom-pane {
            transform-origin: top left;
            padding: 1rem;
            width: max-content;
        }
        .zoom-viewport .mermaid {
            margin-top: 0;
            padding: 0;
            overflow: visible;
        }
        .zoom-viewport.grabbing {
            cursor: grabbing;
        }
        .zoom-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .zoom-bar button {
            font: inherit;
            font-size: 0.95rem;
            line-height: 1;
            min-width: 2.25rem;
            padding: 0.5rem 0.75rem;
            color: #f8fafc;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
        }
        .zoom-bar button:hover {
            background: #475569;
        }
        .zoom-bar button:focus-visible {
            outline: 2px solid #38bdf8;
            outline-offset: 2px;
        }
        .zoom-level {
            color: #94a3b8;
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
            min-width: 4ch;
        }
        .zoom-hint {
            color: #64748b;
            font-size: 0.85rem;
            margin-left: auto;
        }
        .back {
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .empty {
            color: #94a3b8;
        }
        details {
            margin-top: 1.5rem;
            color: #94a3b8;
        }
        details pre {
            background: #0f172a;
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
